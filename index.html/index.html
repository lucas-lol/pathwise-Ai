<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathWise AI - 画像填写测试</title>
    <!-- 引入 Tailwind CSS 样式库 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center py-12 px-4">

    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-8 space-y-8">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">定制你的 AI 学习画像</h2>
            <p class="text-sm text-gray-500 mt-1">拖动滑块与点选标签，轻松完成画像配置</p>
        </div>

        <!-- 1. 年级选择 -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">你目前在读几年级？</label>
            <div class="flex gap-2" id="grade-buttons">
                <button type="button" onclick="setGrade(7)" class="grade-btn px-4 py-2 rounded-lg border font-medium bg-gray-50 text-gray-700 hover:bg-gray-100">初7</button>
                <button type="button" onclick="setGrade(8)" class="grade-btn px-4 py-2 rounded-lg border font-medium bg-gray-50 text-gray-700 hover:bg-gray-100">初8</button>
                <button type="button" onclick="setGrade(9)" class="grade-btn px-4 py-2 rounded-lg border font-medium bg-gray-50 text-gray-700 hover:bg-gray-100">初9</button>
                <button type="button" onclick="setGrade(10)" class="grade-btn px-4 py-2 rounded-lg border font-medium bg-indigo-600 text-white border-indigo-600 shadow">高10</button>
                <button type="button" onclick="setGrade(11)" class="grade-btn px-4 py-2 rounded-lg border font-medium bg-gray-50 text-gray-700 hover:bg-gray-100">高11</button>
                <button type="button" onclick="setGrade(12)" class="grade-btn px-4 py-2 rounded-lg border font-medium bg-gray-50 text-gray-700 hover:bg-gray-100">高12</button>
            </div>
        </div>

        <!-- 2. 兴趣标签点选 -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">
                你对什么最感兴趣？ <span class="text-gray-400 font-normal">（最多选 3 个）</span>
            </label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-2">
                <div onclick="toggleInterest(this, 'technology')" class="interest-card p-3 rounded-xl border cursor-pointer transition flex items-center justify-between border-gray-200 hover:border-gray-300">
                    <div>
                        <div class="font-semibold text-gray-800">💻 科技与编程</div>
                        <div class="text-xs text-gray-500">喜欢写代码、玩科技产品</div>
                    </div>
                    <div class="w-5 h-5 rounded-full flex items-center justify-center border border-gray-300 check-circle"></div>
                </div>
                <div onclick="toggleInterest(this, 'science')" class="interest-card p-3 rounded-xl border cursor-pointer transition flex items-center justify-between border-gray-200 hover:border-gray-300">
                    <div>
                        <div class="font-semibold text-gray-800">🔬 生命与科学</div>
                        <div class="text-xs text-gray-500">探索自然、物理化学实验</div>
                    </div>
                    <div class="w-5 h-5 rounded-full flex items-center justify-center border border-gray-300 check-circle"></div>
                </div>
                <div onclick="toggleInterest(this, 'art')" class="interest-card p-3 rounded-xl border cursor-pointer transition flex items-center justify-between border-gray-200 hover:border-gray-300">
                    <div>
                        <div class="font-semibold text-gray-800">🎨 艺术与设计</div>
                        <div class="text-xs text-gray-500">绘画、UI设计、审美创作</div>
                    </div>
                    <div class="w-5 h-5 rounded-full flex items-center justify-center border border-gray-300 check-circle"></div>
                </div>
            </div>
        </div>

        <!-- 3. 学科成绩滑动条 -->
        <div>
            <div class="flex justify-between items-center mb-1">
                <label class="text-sm font-semibold text-gray-700">数学/逻辑基础自测</label>
                <span id="score-val" class="text-indigo-600 font-bold">80 分</span>
            </div>
            <input type="range" min="0" max="100" step="5" value="80" oninput="updateScore(this.value)"
                class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
            <div class="flex justify-between text-xs text-gray-400 mt-1">
                <span>0 (零基础)</span>
                <span>50 (中游)</span>
                <span>100 (学霸)</span>
            </div>
        </div>

        <!-- 4. 提交按钮 -->
        <button onclick="submitData()" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-lg hover:bg-indigo-700 transition">
            保存画像并开启智能闯关 🚀
        </button>
    </div>

    <script>
        let currentGrade = 10;
        let selectedInterests = [];
        let currentScore = 80;

        function setGrade(grade) {
            currentGrade = grade;
            document.querySelectorAll('.grade-btn').forEach(btn => {
                btn.className = "grade-btn px-4 py-2 rounded-lg border font-medium bg-gray-50 text-gray-700 hover:bg-gray-100";
            });
            event.target.className = "grade-btn px-4 py-2 rounded-lg border font-medium bg-indigo-600 text-white border-indigo-600 shadow";
        }

        function toggleInterest(element, id) {
            const circle = element.querySelector('.check-circle');
            const index = selectedInterests.indexOf(id);
            if (index > -1) {
                selectedInterests.splice(index, 1);
                element.className = "interest-card p-3 rounded-xl border cursor-pointer transition flex items-center justify-between border-gray-200 hover:border-gray-300";
                circle.innerHTML = "";
                circle.className = "w-5 h-5 rounded-full flex items-center justify-center border border-gray-300 check-circle";
            } else {
                if (selectedInterests.length >= 3) {
                    alert('最多只能选择 3 个兴趣方向哦！');
                    return;
                }
                selectedInterests.push(id);
                element.className = "interest-card p-3 rounded-xl border cursor-pointer transition flex items-center justify-between border-indigo-600 bg-indigo-50/50 ring-2 ring-indigo-600/20";
                circle.innerHTML = "✓";
                circle.className = "w-5 h-5 rounded-full flex items-center justify-center border bg-indigo-600 text-white border-indigo-600 check-circle";
            }
        }

        function updateScore(val) {
            currentScore = val;
            document.getElementById('score-val').innerText = val + ' 分';
        }

        function submitData() {
            const data = {
                grade: currentGrade,
                interests: selectedInterests,
                scores: { math: Number(currentScore) }
            };
            alert('模拟提交成功！收集到的数据：\n' + JSON.stringify(data, null, 2));
        }
    </script>
</body>
</html>
